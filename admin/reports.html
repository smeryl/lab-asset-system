<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports - Lab Asset Management</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header><h1>Reports</h1><nav id="mainNav"></nav></header>
  <main>
    <h2>System Reports</h2>
    <p>Reports will appear here. (Admin Only)</p>
  </main>
  <script type="module">
    import { requireAuth, hasRole } from '../js/auth.js';
    import { renderNavigation } from '../js/navigation.js';
    async function init() {
      const user = await requireAuth();
      if (!user || !hasRole(user, ['admin'])) { document.body.innerHTML = '<h1>Access Denied</h1>'; return; }
      await renderNavigation();
    }
    init();
  </script>
</body>
</html>
