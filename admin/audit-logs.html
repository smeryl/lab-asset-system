<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit Logs - Lab Asset Management</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <h1>Audit Trail</h1>
    <nav id="mainNav"></nav>
  </header>

  <main>
    <div class="filters">
      <select id="moduleFilter">
        <option value="">All Modules</option>
        <option value="Borrowing">Borrowing</option>
        <option value="Equipment">Equipment</option>
      </select>
      <select id="actionFilter">
        <option value="">All Actions</option>
        <option value="APPROVED">Approved</option>
        <option value="REJECTED">Rejected</option>
        <option value="RELEASED">Released</option>
        <option value="RETURNED">Returned</option>
        <option value="CREATED">Created</option>
      </select>
      <button id="applyFilter">Filter</button>
    </div>

    <table id="auditTable">
      <thead>
        <tr>
          <th>Date</th>
          <th>User</th>
          <th>Action</th>
          <th>Module</th>
          <th>Record ID</th>
          <th>Description</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>

  <script type="module">
    import { requireAuth, hasRole } from '../js/auth.js';
    import { renderNavigation } from '../js/navigation.js';
    import { fetchAuditLogs } from '../js/audit.js';

    async function init() {
      const user = await requireAuth();
      if (!user) return;

      if (!hasRole(user, ['admin'])) {
        document.body.innerHTML = '<h1>Access Denied</h1>';
        return;
      }

      await renderNavigation();
      await loadLogs();

      document.getElementById('applyFilter').addEventListener('click', loadLogs);
    }

    async function loadLogs() {
      const module = document.getElementById('moduleFilter').value;
      const action = document.getElementById('actionFilter').value;

      try {
        const logs = await fetchAuditLogs({ module, action, limit: 100 });
        const tbody = document.querySelector('#auditTable tbody');
        tbody.innerHTML = logs.map(log => `
          <tr>
            <td>${new Date(log.created_at).toLocaleString()}</td>
            <td>${log.user.full_name} (${log.user.role})</td>
            <td><span class="badge badge-${log.action.toLowerCase()}">${log.action}</span></td>
            <td>${log.module}</td>
            <td>${log.record_id || '-'}</td>
            <td>${log.description}</td>
          </tr>
        `).join('');
      } catch (err) {
        console.error(err);
        alert('Error loading audit logs');
      }
    }

    init();
  </script>
</body>
</html>
