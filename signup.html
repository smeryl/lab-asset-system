<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account - Lab Asset Management</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="login-container">
    <h1>Create your account</h1>
    <p>Request access to the laboratory asset system.</p>
    <form id="signupForm">
      <label for="fullName">Full name</label>
      <input type="text" id="fullName" placeholder="Jane Smith" required>
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="you@example.com" required>
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="At least 6 characters" minlength="6" required>
      <button type="submit">Create account</button>
    </form>
    <p id="errorMessage" class="error"></p>
    <p>Already have an account? <a href="login.html">Sign in</a></p>
  </main>

  <script type="module">
    import { signUp } from './js/auth.js';

    document.getElementById('signupForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const message = document.getElementById('errorMessage');
      message.textContent = '';

      try {
        await signUp(
          document.getElementById('email').value,
          document.getElementById('password').value,
          document.getElementById('fullName').value
        );
        window.location.href = 'index.html';
      } catch (error) {
        message.textContent = error.message;
      }
    });
  </script>
</body>
</html>
